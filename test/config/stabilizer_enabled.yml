enabled: "true"

axes:
  pitch_axis: "y"
  roll_axis: "x"

# thresholds in degrees
thresholds:
  roll: 7
  pitch: 8

offset:
  offset_x: 2.56
  offset_y: 1.03
  set_offset_on_startup: "false"

# channel numbers for the stabilizer servo motors
servo_channels:
  front_right: 6
  front_left: 7
  rear_right: 8
  rear_left: 9